<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title></title>
		<style type="text/css">
			*{
				margin: 0;
				padding: 0;
			}
			html, body{
				width: 100%;
				height: 100%;
			}
			body{
				background: url(8.jpg)center center no-repeat;
				background-size: cover;
				overflow: hidden;
			}
			img{
				position: absolute;
			    left: 50%;
			    top: 50%;
			    transform: translate(-50%,-50%);
			}
			.specter{
				width: 300px;
				height: 300px;
			
				position: absolute;
				top: 1000px;
			}
			.specter>span{
				position: absolute;
				left: 70px;
				top: 200px;
				font-size: 90px;
                color:red;
				font-weight: bold;
				text-shadow: 5px 5px 5px #e01b1b;
			}
		</style>
	</head>
	<body>
		<img src="小鱼打字开始按钮.png"/>
		<audio src="梦的传说.MP3"loop ></audio>
		<!--<div class="specter">
			<span>m</span>
		</div>-->
		<script type="text/javascript">
			let oImg =document.querySelector("img");
			let oAudio =document.querySelector("audio");
			let list=[];//定义数组保存所有创建出来的鬼魂对象
			oImg.onclick=function(){
				//1.移出开始游戏按钮
				oImg.parentNode.removeChild(oImg);
				oAudio.play();
				//2.创建幽灵
				setInterval(function(){
					let s=new Specter();
				    s.fly();
				    list.push(s);
				},1000);
			};
			class Specter{
				constructor(){
					//1.创建div并设置样式
					let oDiv=document.createElement("div");
//					oDiv.className="specter";
					oDiv.style.top="1000px";
					oDiv.style.left=Math.random()*1500+"px";
					//2.创建span并设置样式
					let oSpan=document.createElement("span");
					let key =this.generateKey();
					oSpan.innerText=key;
					oDiv.className="specter "+key;
					//3.将span添加到div中
					oDiv.appendChild(oSpan);
					//4.将div添加到body中
					document.body.appendChild(oDiv);
					this.oDiv = oDiv;
				}
				bomb(){
					//1.删除当前的幽灵
					document.body.removeChild(this.oDiv);
					//2.删除当前幽灵对应的定时器
					clearInterval(this.timer);
				}
				fly(){
					//1.获取幽灵当前的top值
					let offset= parseInt(this.oDiv.style.top);
					let self =this;
					//2.开启定时器不断修改幽灵位置
					this.timer=window.setInterval(function(){
						offset-=20;
						if(offset<=-300){
							self.bomb();
						}
						self.oDiv.style.top=offset+"px";
					},200);
				}
				generateKey(){
					let num=Math.floor(Math.random()*(90-65+1))+65;
					return String.fromCharCode(num);
				}
			}
			document.body.onkeydown=function(event){
				let key=event.key.toUpperCase();
				let oDiv=document.querySelector("."+key);
//				document.body.removeChild(oDiv);
				//1.根据div找到这个div对应的鬼魂对象在数组中的位置
				let currentIndex=list.findIndex(function(currentValue){
					return currentValue.oDiv===oDiv;
				});
				if(currentIndex===-1) return;
				//2.根据位置取出对应的鬼魂对象
				let currentSpecter=list[currentIndex];
				//3.将鬼魂对应的div从body中删除
				currentSpecter.bomb();
				list.splice(currentIndex,1);
			}
		</script>
	</body>
</html>
