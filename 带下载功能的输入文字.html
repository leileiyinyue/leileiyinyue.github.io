<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title></title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #f5f5f5;
    padding: 50px;
  }
  .container {
    width: 600px;
    margin: 0 auto;
  }
  #searchInput {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    font-size: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
  }
  #searchInput:focus {
    border-color: #1890ff;
  }
  .word-show-box {
    margin-top: 20px;
    display: flex;
    gap: 0;
    padding: 0;
    background: #fff;
    min-height: 80px;
  }
  .word-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    display: block;
    border: 0;
  }
  .empty-tip {
    color: #999;
    font-size: 16px;
    padding: 15px;
  }
  .downBtn {
    margin-top: 18px;
    padding: 10px 30px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .downBtn:hover {
    background: #1d4ed8;
  }
  .downBtn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="container">
  <input id="searchInput" placeholder="输入文字组合图片" autocomplete="off">
  <div id="wordShowBox" class="word-show-box"></div>
  <button class="downBtn" id="downBtn" disabled>下载组合图片</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// 本地图/网络图 随便切换都能用
const wordData = [
  { char: "清", img: "1.png" },
  { char: "明", img: "2.png" },
  { char: "节", img: "3.png" },
  { char: "智", img: "4.png" },
];

const input = document.getElementById('searchInput');
const box = document.getElementById('wordShowBox');
const downBtn = document.getElementById('downBtn');

input.addEventListener('input', function(){
  let val = this.value.trim();
  renderImg(val);
  downBtn.disabled = val ? false : true;
})

function renderImg(text){
  box.innerHTML = '';
  if(!text){
    box.innerHTML = '<span class="empty-tip">请输入文字</span>';
    return;
  }
  for(let i=0; i<text.length; i++){
    let c = text[i];
    let item = wordData.find(item=>item.char === c);
    if(item){
      let img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = item.img;
      img.className = 'word-img';
      box.appendChild(img);
    }
  }
}

downBtn.addEventListener('click', function(){
  let fileName = input.value || "文字组合图";
  html2canvas(box, {
    useCORS: true,
    allowTaint: false,
    backgroundColor: null
  }).then(canvas=>{
    let a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = fileName + ".png";
    a.click();
  })
})

renderImg('');
</script>
</body>
</html>
