const input = document.getElementById('searchInput');
const box = document.getElementById('wordShowBox');
const downBtn = document.getElementById('downBtn');
let loadedImages = [];

// ======================================
// 【核心修复】输入立刻触发、绝不失效
// ======================================
input.oninput = function () {
  const val = (this.value || "").trim();
  renderImg(val);
  
  // 按钮启用逻辑
  downBtn.disabled = val.length === 0;
};

// ======================================
// 【100%显示】同步渲染，输入就出图
// ======================================
function renderImg(text) {
  box.innerHTML = "";
  loadedImages = [];

  if (!text) {
    box.innerHTML = '<span class="empty-tip">请输入文字</span>';
    return;
  }

  // 遍历每个字，直接创建图片
  for (let char of text) {
    const item = wordData.find(w => w.char === char);
    if (!item) continue;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.className = "word-img";
    img.src = item.img;
    box.appendChild(img);
    loadedImages.push(img);
  }
}

// ======================================
// 下载功能（3500字稳定不崩溃）
// ======================================
downBtn.onclick = async function () {
  this.disabled = true;
  this.textContent = "长图生成中...";

  // 等待所有图片加载完成
  await Promise.all(loadedImages.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(r => (img.onload = r, img.onerror = r));
  }));

  // 克隆容器
  const clone = box.cloneNode(true);
  clone.style.cssText = "position:fixed;left:-9999px;top:0;display:flex;width:auto;height:200px;background:#fff";
  document.body.appendChild(clone);

  try {
    const canvas = await html2canvas(clone, {
      useCORS: true,
      allowTaint: false,
      backgroundColor: "#fff",
      scale: 1,
      logging: false
    });

    const a = document.createElement("a");
    a.download = "3500字拼接长图.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  } catch (e) {}

  document.body.removeChild(clone);
  this.textContent = "下载拼接长图";
  this.disabled = false;
};
