<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title></title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #f5f5f5;
    padding: 50px;
  }
  .container {
    width: 600px;
    margin: 0 auto;
  }
  #searchInput {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    font-size: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
  }
  #searchInput:focus {
    border-color: #1890ff;
  }
  .word-show-box {
    margin-top: 20px;
    /* 关键修复：允许横向滚动 + 不裁剪内容 */
    display: flex;
    gap: 0;
    padding: 0;
    background: #fff;
    min-height: 200px; /* 匹配图片高度 */
    overflow-x: auto; /* 页面上可以滚动查看 */
    overflow-y: hidden;
  }
  .word-img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    display: block;
    border: 0;
    /* 关键：防止图片被压缩 */
    flex-shrink: 0;
  }
  .empty-tip {
    color: #999;
    font-size: 16px;
    padding: 15px;
  }
  .downBtn {
    margin-top: 18px;
    padding: 10px 30px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .downBtn:hover {
    background: #1d4ed8;
  }
  .downBtn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="container">
  <input id="searchInput" placeholder="输入文字组合图片" autocomplete="off">
  <div id="wordShowBox" class="word-show-box"></div>
  <button class="downBtn" id="downBtn" disabled>下载组合图片</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// 本地图/网络图 随便切换都能用
const wordData = [
  { char: "母", img: "1.png" },
  { char: "亲", img: "2.png" },
  { char: "安", img: "3.png" },
  { char: "康", img: "4.png" },
];

const input = document.getElementById('searchInput');
const box = document.getElementById('wordShowBox');
const downBtn = document.getElementById('downBtn');

input.addEventListener('input', function(){
  let val = this.value.trim();
  renderImg(val);
  downBtn.disabled = val ? false : true;
})

function renderImg(text){
  box.innerHTML = '';
  if(!text){
    box.innerHTML = '<span class="empty-tip">请输入文字</span>';
    return;
  }
  for(let i=0; i<text.length; i++){
    let c = text[i];
    let item = wordData.find(item=>item.char === c);
    if(item){
      let img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = item.img;
      img.className = 'word-img';
      box.appendChild(img);
    }
  }
}

downBtn.addEventListener('click', function(){
  let fileName = input.value || "文字组合图";
  
  // 克隆一个无宽度限制的容器给 html2canvas 截取
  const cloneBox = box.cloneNode(true);
  cloneBox.style.width = 'auto';
  cloneBox.style.overflow = 'visible';
  cloneBox.style.position = 'absolute';
  cloneBox.style.left = '-9999px';
  document.body.appendChild(cloneBox);

  html2canvas(cloneBox, {
    useCORS: true,
    allowTaint: false,
    backgroundColor: null,
    scale: 2 // 提高下载图片清晰度
  }).then(canvas=>{
    let a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = fileName + ".png";
    a.click();
    // 截图完移除克隆节点
    document.body.removeChild(cloneBox);
  })
})

renderImg('');
</script>
</body>
</html>
