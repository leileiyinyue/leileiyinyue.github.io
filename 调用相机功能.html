<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相机拍照</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f1f1f1;
        }
        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #007aff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 36px;
            height: 36px;
            fill: #007aff;
        }
        #camera {
            display: none;
        }
        img {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div>
    <label class="btn" for="camera">
        <svg viewBox="0 0 24 24">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm4.2-6.2a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm-10.4 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm11.4 5a3.5 3.5 0 0 1-3.5 3.5h-7a3.5 3.5 0 0 1-3.5-3.5v-5A3.5 3.5 0 0 1 8.5 5.5h7A3.5 3.5 0 0 1 19 9v5z"/>
        </svg>
    </label>
    <input type="file" id="camera" accept="image/*" capture="environment">
    <img id="preview">
</div>

<script>
    const input = document.getElementById('camera');
    const img = document.getElementById('preview');

    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        img.src = URL.createObjectURL(file);
    };
</script>

</body>
</html>
